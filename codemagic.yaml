workflows:
  ios-workflow:
    name: iOS Build

    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install pods
        script: |
          cd ios
          pod install

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/HirelinkApp.xcworkspace \
            --scheme HirelinkApp

    artifacts:
      - build/ios/ipa/*.ipa
