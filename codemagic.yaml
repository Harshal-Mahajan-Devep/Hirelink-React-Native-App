workflows:
  ios-workflow:
    name: iOS Build

    instance_type: mac_mini_m2

    environment:
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install Pods
        script: |
          cd ios
          pod repo update
          pod install --repo-update --verbose

      - name: Build iOS App
        script: |
          xcodebuild \
          -project ios/HirelinkApp.xcodeproj \
          -scheme HirelinkApp \
          -sdk iphoneos \
          -configuration Release \
          build CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/ios/ipa/*.ipa
