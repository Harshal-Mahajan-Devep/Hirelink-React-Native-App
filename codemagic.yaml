workflows:
  ios-workflow:
    name: iOS Build

    instance_type: mac_mini_m2

    environment:
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install Pods
        script: |
          cd ios
          pod repo update
          pod install --repo-update --verbose

      - name: Build IPA
  script: |
    xcode-project build-ipa \
      --project ios/HirelinkApp.xcodeproj \
      --scheme HirelinkApp \
      --archive-xcargs "CODE_SIGNING_ALLOWED=NO"

    artifacts:
      - build/ios/ipa/*.ipa
