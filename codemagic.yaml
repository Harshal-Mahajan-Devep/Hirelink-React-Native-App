workflows:
  ios-workflow:
    name: iOS Build

    instance_type: mac_mini_m2

    environment:
      xcode: 16.3
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install Pods
        script: |
          cd ios
          pod repo update
          pod install --repo-update

      - name: Build iOS App
        script: |
          cd ios
          xcodebuild \
            -workspace HirelinkApp.xcworkspace \
            -scheme HirelinkApp \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            clean build

    artifacts:
      - "**/*.app"
      - "**/*.xcarchive"
